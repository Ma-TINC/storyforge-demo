#choices { display: flex; flex-direction: column; gap: 12px; }
.choice-btn {

  background: rgba(255, 252, 244, .7); border: 1px solid rgba(90, 70, 40, .28);
  padding: 13px 20px; border-radius: 4px; cursor: pointer; transition: all .18s; line-height: 1.7;
}
.choice-btn:hover { border-color: #8a6a3f; background: #fffaf0; transform: translateX(4px); }

/* 结局页 */
#ending-panel { text-align: center; }
#ending-badge {
  display: inline-block; padding: 8px 26px; border-radius: 3px; letter-spacing: 6px;
  background: linear-gradient(160deg, #8a1f1f, #5c1515); color: #f6e9d8; font-size: 17px;

}

}
#ending-actions { margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.small-btn {

}
.small-btn.primary { background: #6b4a26; color: #f3ead8; border: none; }
.small-btn.primary:hover { background: #5a3d1f; }

#combat-stage {
  background: radial-gradient(ellipse at 50% 120%, rgba(90, 60, 20, .18), transparent 60%),

  padding: 26px 30px; box-shadow: inset 0 0 60px rgba(120, 90, 40, .08);
}
#combat-hud { display: flex; justify-content: space-between; gap: 18px; margin-bottom: 20px; }

.hud-name { font-size: 15px; letter-spacing: 2px; color: #4a3218; margin-bottom: 8px; }

  margin-bottom: 16px; white-space: pre-wrap;
}
#combat-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---- 机甲立绘舞台（V2） ---- */
#combat-arena {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; min-height: 340px; margin-bottom: 16px;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(120, 90, 40, .18), transparent 62%),
    linear-gradient(180deg, #e9dcc0, #ddcba9);
  border: 1px solid rgba(90, 70, 40, .2); border-radius: 6px;
  padding: 18px 22px 8px; position: relative; overflow: hidden;
}
#combat-arena::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
  background: linear-gradient(180deg, transparent, rgba(90, 70, 40, .14));
}
.mech-wrap { width: 46%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mech-wrap.enemy { transform: scaleX(-1); }  /* 敌方镜像对位 */
.mech-name {
  font-size: 13px; letter-spacing: 2px; color: #7d6242;
  background: rgba(255, 252, 244, .75); border: 1px solid rgba(90, 70, 40, .2);
  padding: 3px 12px; border-radius: 12px;
}
.mech-wrap svg.mech { width: 100%; height: auto; max-width: 240px; }
.mech-wrap.enemy svg.mech { transform: scaleX(-1); }  /* 镜像回来，文字不翻转 */

/* 立绘部件动画状态 */
svg.mech .m-horn { transform-origin: center bottom; transition: transform .25s; }
svg.mech .m-eye { transition: fill .25s; }
svg.mech .core-spin { transform-origin: center center; animation: tjspin 3.2s linear infinite; }
@keyframes tjspin { to { transform: rotate(360deg); } }
.mech-idle { animation: idle-bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes idle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* 玩家攻击：整体前冲 + 武器挥动 */
.mech-wrap.player .mech-attack { animation: melee 0.5s ease-out; transform-origin: 60% 90%; }
@keyframes melee { 0% { transform: translate(0,0) rotate(0); } 40% { transform: translate(18px,-6px) rotate(-8deg); } 100% { transform: translate(0,0) rotate(0); } }
/* 敌方攻击：整体前冲 */
.mech-wrap.enemy .mech-attack { animation: e-melee 0.5s ease-out; transform-origin: 40% 90%; }
@keyframes e-melee { 0% { transform: translate(0,0); } 40% { transform: translate(-18px,-6px); } 100% { transform: translate(0,0); } }
/* 受击：闪红抖动 */
.mech-wrap .mech-hit { animation: hit-flash 0.45s; }
@keyframes hit-flash {
  0%,100% { filter: none; transform: translate(0,0); }
  25% { filter: brightness(1.8) sepia(0.5) hue-rotate(-30deg); transform: translate(-4px,2px); }
  50% { filter: brightness(2) sepia(0.6); transform: translate(4px,-2px); }
  75% { filter: brightness(1.8) sepia(0.5); transform: translate(-3px,1px); }
}
/* 蓄力：核心加速 + 金光 */
.mech-wrap .mech-charge .core-spin { animation-duration: 0.7s; }
.mech-wrap .mech-charge { animation: charge-glow 0.8s ease-in-out infinite; }
@keyframes charge-glow { 0%,100% { filter: drop-shadow(0 0 2px rgba(201,168,106,.6)); } 50% { filter: drop-shadow(0 0 16px rgba(232,217,168,1)); } }
/* 防御：举盾姿态（轻微后仰） */
.mech-wrap .mech-defend { animation: guard 0.6s ease-in-out; transform-origin: 50% 100%; }
@keyframes guard { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(0,-6px) rotate(6deg); } }
/* 胜利/败北姿态 */
.mech-wrap .mech-win { animation: win-pose 0.7s ease-out forwards; transform-origin: 50% 100%; }
@keyframes win-pose { 0% { transform: translateY(0); } 60% { transform: translateY(-16px); } 100% { transform: translateY(0) scale(1.04); } }
.mech-wrap .mech-lose { animation: lose-pose 0.8s ease-in forwards; transform-origin: 50% 100%; }
@keyframes lose-pose { 0% { transform: rotate(0) translateY(0); } 100% { transform: rotate(-14deg) translateY(22px); filter: grayscale(.6); } }

": 18}, "player": {"name": {"zh": "玄龙", "en": "玄龙", "ja": "玄龙", "ko": "玄龙"}, "hp": 100, "atk": 25}, "victory_to": "sv", "defeat_to": "e4", "dialogues": {"start": ["黑翼：『你终于来了。同源的太极，分个高下。』", "暗枭的翼甲张开，残阳在刃上流动。"], "attack": ["玄龙龙牙刀劈出半月弧光：『守住边境，就是守住了来路！』", "黑翼侧身闪开：『不错，再来。』"], "charge": ["太极核心全速运转，龙吟穿透战场。", "黑翼冷笑：『亮出你的杀招吧。』"], "defend": ["你举刀格挡，金铁交鸣声震四野。", "黑翼：『防御不错，但一味防守赢不了。』"], "enemy_turn": ["暗枭俯冲而至，鸦爪刃划破风声！", "黑翼：『你犹豫了——在想什么？』"], "victory": ["暗枭的核心太极图缓缓熄灭。黑翼的声音从通讯里传来：「你的太极……比我的圆。」", "边境的风吹过战场，玄龙单膝落地——不是战败，是敬礼。"], "defeat": ["玄龙轰然跪地，警报声淹没一切。", "龙魂玉还在发光：『下一次，你会赢。』"]}, "mechs": {"zh": {"player": {"name": "玄龙", "title": "东方龙甲 · 玄龙", "palette": {"armor": "#2f6f5f", "armor_dark": "#1e4f42", "armor_light": "#4a9a86", "gold": "#c9a86a", "gold_light": "#e8d9a8", "accent": "#a8443a", "eye": "#ffb84d", "core_dark": "#22303c", "core_light": "#f5f0e6", "scarf": "#a8443a"}, "style": {"horns": "dragon", "shoulders": "scale", "weapon": "blade", "core": "taiji", "scarf": true}}, "enemy": {"name": "暗枭", "title": "黑翼机甲 · 暗枭", "palette": {"armor": "#3a2f4f", "armor_dark": "#241c36", "armor_light": "#5c4a7a", "gold": "#8a6fbf", "gold_light": "#c3b0e0", "accent": "#7a1f2b", "eye": "#e0483f", "core_dark": "#1a141f", "core_light": "#d9c9e8", "scarf": null}, "style": {"horns": "owl", "shoulders": "feather", "weapon": "claw", "core": "taiji_dark", "scarf": false}}}, "en": {"player": {"name": "玄龙", "title": "东方龙甲 · 玄龙", "palette": {"armor": "#2f6f5f", "armor_dark": "#1e4f42", "armor_light": "#4a9a86", "gold": "#c9a86a", "gold_light": "#e8d9a8", "accent": "#a8443a", "eye": "#ffb84d", "core_dark": "#22303c", "core_light": "#f5f0e6", "scarf": "#a8443a"}, "style": {"horns": "dragon", "shoulders": "scale", "weapon": "blade", "core": "taiji", "scarf": true}}, "enemy": {"name": "暗枭", "title": "黑翼机甲 · 暗枭", "palette": {"armor": "#3a2f4f", "armor_dark": "#241c36", "armor_light": "#5c4a7a", "gold": "#8a6fbf", "gold_light": "#c3b0e0", "accent": "#7a1f2b", "eye": "#e0483f", "core_dark": "#1a141f", "core_lig     var wrap = $("choices");
    wrap.innerHTML = "";
    var nexts = scene.next || {};
    var keys = Object.keys(nexts);
    if (!keys.length) { keys = ["e1"]; }
    keys.forEach(function (label) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = pt(label);
      btn.addEventListener("click", function () { goTo(nexts[label]); });
      wrap.appendChild(btn);
    });
    window.scrollTo(0, 0);
  }

  function renderEnding(eid) {
    var end = null;
    (DATA.endings || []).forEach(function (e) { if (e.id === eid) end = e; });
    if (!end) end = (DATA.endings || [])[0];
    show("ending-panel");
    state.sceneId = end.id;
    $("ending-badge").textContent = t("ending");
    $("ending-name").textContent = pt(end.name);
    $("ending-text").textContent = pt(end.text);
    $("ending-actions").innerHTML = "";
    var again = document.createElement("button");
    again.className = "small-btn primary";
    again.textContent = t("play_again");
    again.addEventListener("click", function () { state.sceneId = null; renderTitle(); });
    $("ending-actions").appendChild(again);
    var home = document.createElement("button");
    home.className = "small-btn ghost";
    home.textContent = t("back_to_title");
    home.addEventListener("click", function () { state.sceneId = null; renderTitle(); });
    $("ending-actions").appendChild(home);
    window.scrollTo(0, 0);
  }

  function goTo(target) {
    if (!target) { renderEnding("e1"); return; }
    if (target.charAt(0) === "e") { renderEnding(target); return; }
    var scene = DATA.scenes[target];
    if (!scene) { renderEnding("e1"); return; }
    if (scene.type === "combat") { renderCombat(target); return; }
    if (scene.type === "climax") { renderClimax(target); return; }
    renderScene(target);
  }

  // ---------- 回合制战斗（V2：立绘 + 对话 + 动画） ----------
  var battle = null;
  var inventory = [];

  function say(who, text) {
    // 战斗对话气泡
    var d = $("combat-dialog");
    d.innerHTML = "";
    var w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    var t = document.createElement("span");
    t.textContent = text;
    d.appendChild(w);
    d.appendChild(t);
  }

  function dialog(key, fallback) {
    // 从战斗对话库取随机一句（多语种）
    var arr = battle.dialogue[key];
    if (!arr || !arr.length) return fallback;
    var s = arr[Math.floor(Math.random() * arr.length)];
    if (typeof s === "object") { return pt(s); }
    return s;
  }

  function setPose(wrap, cls) {
    var svg = wrap.querySelector("svg");
    if (!svg) return;
    var g = svg.querySelector("g");
    if (!g) return;
    g.className.baseVal = cls;
    setTimeout(function () { g.className.baseVal = "mech-idle"; }, 620);
  }

  function showReward(name) {
    var t = $("reward-toast");
    t.textContent = t("battle_reward") + "：" + name;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function renderCombat(sid) {
    var scene = DATA.scenes[sid];
    if (!scene) return;
    state.sceneId = sid;
    battle = {
      player: { hp: scene.player.hp, max: scene.player.hp, atk: scene.player.atk, name: pt(scene.player.name) },
      enemy: { hp: scene.enemy.hp, max: scene.enemy.hp, atk: scene.enemy.atk, name: pt(scene.enemy.name) },
      log: [],
      over: false, win: false,
      victoryTo: scene.victory_to, defeatTo: scene.defeat_to,
      reward: scene.reward || null,
      dialogue: scene.dialogues || {},
    };
    // 立绘
    var pm = $("player-mech"), em = $("enemy-mech");
    if (scene.mech_svg) {
      pm.innerHTML = scene.mech_svg.player;
      em.innerHTML = scene.mech_svg.enemy;
      pm.querySelector("svg").setAttribute("class", "mech");
      em.querySelector("svg").setAttribute("class", "mech");
    }
    show("combat-panel");
    renderBattle();
    // 开场对话
    var sd = battle.dialogue.start;
    if (sd && sd.length) {
      var s = sd[0];
      say(pt(scene.player.name), (typeof s === "object" ? pt(s) : s));
    }
    window.scrollTo(0, 0);
  }

  function renderBattle() {
    if (!battle) return;
    $("cb-name").textContent = pt(DATA.title) + " · " + t("chapter");
    $("hud-player-name").textContent = battle.player.name;
    $("hud-enemy-name").textContent = battle.enemy.name;
    renderHp($("hp-player-fill"), $("hp-player-num"), battle.player);
    renderHp($("hp-enemy-fill"), $("hp-enemy-num"), battle.enemy);
    var log = battle.log.join("\\n");
    $("combat-log").textContent = log;
    $("combat-log").scrollTop = $("combat-log").scrollHeight;
    $("combat-actions").innerHTML = "";
    if (battle.over) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = t("continue");
      btn.addEventListener("click", function () { battleContinue(); });
      $("combat-actions").appendChild(btn);
    } else {
      ["attack", "charge", "defend"].forEach(function (act) {
        var b = document.createElement("button");
        b.className = "choice-btn";
        b.textContent = t("battle_" + act);
        b.addEventListener("click", function () { doAction(act); });
        $("combat-actions").appendChild(b);
      });
    }
  }

  function battleContinue() {
    if (battle.reward && battle.win) {
      inventory.push(battle.reward);
      showReward(pt({ zh: battle.reward }) || battle.reward);
    }
    var target = battle.win ? battle.victoryTo : battle.defeatTo;
    if (!target) { renderEnding("e1"); return; }
    if (target.charAt(0) === "e") { renderEnding(target); return; }
    var scene = DATA.scenes[target];
    if (scene && scene.type === "combat") { renderCombat(target); return; }
    if (scene && scene.type === "climax") { renderClimax(target); return; }
    renderScene(target);
  }

  function renderHp(fillEl, numEl, unit) {
    var pct = Math.max(0, Math.round(unit.hp / unit.max * 100));
    fillEl.style.width = pct + "%";
    fillEl.classList.toggle("low", pct <= 30);
    numEl.textContent = unit.hp + " / " + unit.max;
  }

  function doAction(act) {
    if (!battle || battle.over) return;
    var line = "";
    var dmg = Math.max(1, Math.round(battle.player.atk * (0.85 + Math.random() * 0.3)));
    if (act === "charge") dmg = Math.round(dmg * 1.6);
    battle.enemy.hp = Math.max(0, battle.enemy.hp - dmg);
    // 玩家立绘动画
    setPose(document.querySelector(".mech-wrap.player"), act === "attack" ? "mech-attack" : (act === "charge" ? "mech-charge" : "mech-defend"));
    say(battle.player.name, dialog(act, ""));
    line = battle.player.name + " " + t("battle_attack") + " " + dmg + " ！";
    if (act === "charge") line = battle.player.name + " " + t("battle_charge") + "，" + t("battle_attack") + " " + dmg + " ！";

    if (battle.enemy.hp <= 0) {
      setPose(document.querySelector(".mech-wrap.enemy"), "mech-lose");
      setPose(document.querySelector(".mech-wrap.player"), "mech-win");
      battle.log.push(line);
      battle.log.push(dialog("victory", t("battle_victory")));
      battle.over = true; battle.win = true;
      renderBattle(); return;
    }
    // 敌方回合
    setPose(document.querySelector(".mech-wrap.enemy"), "mech-attack");
    setTimeout(function () {
      setPose(document.querySelector(".mech-wrap.player"), "mech-hit");
    }, 60);
    var edmg = Math.max(1, Math.round(battle.enemy.atk * (0.8 + Math.random() * 0.3)));
    if (act === "defend") edmg = Math.round(edmg * 0.4);
    battle.player.hp = Math.max(0, battle.player.hp - edmg);
    say(battle.enemy.name, dialog("enemy_turn", ""));
    line += "\\n" + battle.enemy.name + " " + t("battle_attack") + " " + edmg + " ！";
    if (battle.player.hp <= 0) {
      setPose(document.querySelector(".mech-wrap.player"), "mech-lose");
      setPose(document.querySelector(".mech-wrap.enemy"), "mech-win");
      battle.log.push(line);
      battle.log.push(dialog("defeat", t("battle_defeat")));
      battle.over = true; battle.win = false;
      renderBattle(); return;
    }
    battle.log.push(line);
    renderBattle();
  }

  // ---------- 凯旋抉择场景（含隐藏结局解锁） ----------
  function renderClimax(sid) {
    var scene = DATA.scenes[sid];
    if (!scene) { renderEnding("e1"); return; }
    show("story-panel");
    state.sceneId = sid;
    $("chapter-tag").textContent = pt(scene.title);
    var text = pt(scene.text);
    $("scene-text").innerHTML = "";
    var first = document.createElement("span");
    first.className = "first";
    first.textContent = text.charAt(0);
    $("scene-text").appendChild(first);
    $("scene-text").appendChild(document.createTextNode(text.slice(1)));

    $("choice-label").textContent = t("choice");
    var wrap = $("choices");
    wrap.innerHTML = "";
    var nexts = scene.next || {};
    var keys = Object.keys(nexts);
    // 隐藏结局：道具集齐时追加选项
    var he = scene.hidden_ending;
    var hiddenUnlocked = false;
    if (he && he.requires) {
      hiddenUnlocked = he.requires.every(function (name) { return inventory.indexOf(name) >= 0; });
      if (hiddenUnlocked) {
        keys.push(jsonKey(he));
      }
    }
    keys.forEach(function (label) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      if (he && label === jsonKey(he)) {
        btn.textContent = hiddenLabel(he);
      } else {
        btn.textContent = pt(label);
      }
      btn.addEventListener("click", function () {
        var target = nexts[label];
        if (!target && he) { target = he.eid; }
        goTo(target);
      });
      wrap.appendChild(btn);
    });
    // 隐藏结局提示条
    var hint = $("sv-hidden-hint");
    if (hint) hint.remove();
    if (he) {
      var hv = document.createElement("div");
      hv.id = "sv-hidden-hint";
      hv.textContent = hiddenUnlocked
        ? t("hidden_ending_hint")
        : "🔒 " + t("hidden_ending_hint");
      wrap.parentNode.appendChild(hv);
    }
    window.scrollTo(0, 0);
  }

  function jsonKey(he) {
    return "__hidden__" + he.eid;
  }

  function hiddenLabel(he) {
    return "🌟 " + pt(he.name);
  }

  // 初始化
  var langBar = $("lang-bar");
  LANGS.forEach(function (code) {
    var b = document.createElement("button");
    b.className = "lang-btn";
    b.setAttribute("data-lang", code);
    b.textContent = code.toUpperCase();
    b.addEventListener("click", function () { setLang(code); });
    langBar.appendChild(b);
  });
  $("start-btn").addEventListener("click", function () { goTo(DATA.start_id || "s0"); });
  updateLangBtns();
  renderTitle();
})();

</script>
</body>
</html>
